# =============================================================================
# TWINSCOPE / VISITE360 — PRODUCTION
# Django + Daphne + Celery + PostgreSQL/pgvector + Redis
# YOLO + PaddleOCR + Gemini Vision + OpenAI Vision
# =============================================================================

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DEBUG: "0"

  # Database
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: elevateaidb
  DB_USER: elevateaiuser
  DB_PASS_FILE: /run/secrets/db_password

  # Redis / Celery / Channels
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""

  # Text and RAG providers
  AI_PRIMARY_TEXT_PROVIDER: "${AI_PRIMARY_TEXT_PROVIDER:-openai}"
  AI_FALLBACK_TEXT_PROVIDER: "${AI_FALLBACK_TEXT_PROVIDER:-gemini}"
  AI_ENABLE_GEMINI: "${AI_ENABLE_GEMINI:-true}"
  AI_ENABLE_GEMINI_VISION: "${AI_ENABLE_GEMINI_VISION:-true}"
  AI_ENABLE_OPENAI: "${AI_ENABLE_OPENAI:-true}"
  AI_ENABLE_ULTRALYTICS: "${AI_ENABLE_ULTRALYTICS:-true}"
  AI_DEFAULT_TEXT_PROVIDER: "${AI_DEFAULT_TEXT_PROVIDER:-OPENAI}"
  AI_DEFAULT_IMAGE_PROVIDER: "${AI_DEFAULT_IMAGE_PROVIDER:-GOOGLE_VERTEX}"
  AI_DEFAULT_VISION_PROVIDER: "${AI_DEFAULT_VISION_PROVIDER:-ULTRALYTICS}"
  AI_PRIMARY_VISION_PROVIDER: "${AI_PRIMARY_VISION_PROVIDER:-fusion}"
  AI_EMBEDDING_PROVIDER: "${AI_EMBEDDING_PROVIDER:-openai}"
  AI_FALLBACK_EMBEDDING_PROVIDER: "${AI_FALLBACK_EMBEDDING_PROVIDER:-gemini}"
  AI_EMBEDDING_DIMENSIONS: "${AI_EMBEDDING_DIMENSIONS:-1536}"
  GOOGLE_EMBEDDING_NATIVE_DIMENSIONS: "${GOOGLE_EMBEDDING_NATIVE_DIMENSIONS:-768}"
  AI_ALLOW_DETERMINISTIC_EMBEDDINGS: "${AI_ALLOW_DETERMINISTIC_EMBEDDINGS:-false}"
  AI_PROVIDER_FAILURE_COOLDOWN_SECONDS: "${AI_PROVIDER_FAILURE_COOLDOWN_SECONDS:-300}"
  AI_PROVIDER_RETRY_BASE_SECONDS: "${AI_PROVIDER_RETRY_BASE_SECONDS:-2}"
  AI_PROVIDER_RETRY_MAX_SECONDS: "${AI_PROVIDER_RETRY_MAX_SECONDS:-20}"

  # Google Vertex AI / Gemini
  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_adc_json
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:-ziarama-wedding-akk}"
  GOOGLE_CLOUD_LOCATION: "${GOOGLE_CLOUD_LOCATION:-us-central1}"
  GOOGLE_TEXT_MODEL: "${GOOGLE_TEXT_MODEL:-gemini-2.5-flash}"
  GEMINI_TOUR_VISION_MODEL: "${GEMINI_TOUR_VISION_MODEL:-gemini-2.5-flash}"
  GOOGLE_VISION_MODEL: "${GOOGLE_VISION_MODEL:-gemini-2.5-flash}"
  GOOGLE_EMBEDDING_MODEL: "${GOOGLE_EMBEDDING_MODEL:-text-embedding-004}"
  GOOGLE_IMAGE_MODEL: "${GOOGLE_IMAGE_MODEL:-imagen-4.0-generate-001}"
  DEFAULT_AI_IMAGE_PROVIDER: "${DEFAULT_AI_IMAGE_PROVIDER:-GOOGLE_VERTEX}"

  # OpenAI
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_TEXT_MODEL: "${OPENAI_TEXT_MODEL:-gpt-5.6}"
  OPENAI_VISION_MODEL: "${OPENAI_VISION_MODEL:-gpt-5.6}"
  OPENAI_IMAGE_MODEL: "${OPENAI_IMAGE_MODEL:-gpt-image-1}"
  OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}"

  AI_TEXT_TEMPERATURE: "${AI_TEXT_TEMPERATURE:-0.2}"
  AI_TEXT_MAX_TOKENS: "${AI_TEXT_MAX_TOKENS:-1400}"

  # YOLO
  TOUR_AI_YOLO_MODEL_NAME: "${TOUR_AI_YOLO_MODEL_NAME:-yolo11m.pt}"
  TOUR_AI_YOLO_MODEL_PATH: "/app/model_weights/${TOUR_AI_YOLO_MODEL_NAME:-yolo11m.pt}"
  TOUR_AI_YOLO_DEVICE: "${TOUR_AI_YOLO_DEVICE:-cpu}"
  TOUR_AI_YOLO_CONFIDENCE: "${TOUR_AI_YOLO_CONFIDENCE:-0.25}"
  TOUR_AI_YOLO_IOU: "${TOUR_AI_YOLO_IOU:-0.45}"
  TOUR_AI_YOLO_IMAGE_SIZE: "${TOUR_AI_YOLO_IMAGE_SIZE:-1280}"
  TOUR_AI_YOLO_VERBOSE: "${TOUR_AI_YOLO_VERBOSE:-false}"
  YOLO_MODEL: "/app/model_weights/${TOUR_AI_YOLO_MODEL_NAME:-yolo11m.pt}"
  YOLO_DEVICE: "${TOUR_AI_YOLO_DEVICE:-cpu}"
  YOLO_CONFIDENCE: "${TOUR_AI_YOLO_CONFIDENCE:-0.25}"
  YOLO_IOU: "${TOUR_AI_YOLO_IOU:-0.45}"
  YOLO_VERBOSE: "${TOUR_AI_YOLO_VERBOSE:-false}"

  # Advanced 360 vision
  VISION_ENABLE_YOLO: "${VISION_ENABLE_YOLO:-true}"
  VISION_ENABLE_FLORENCE2: "${VISION_ENABLE_FLORENCE2:-false}"
  VISION_ENABLE_PADDLEOCR: "${VISION_ENABLE_PADDLEOCR:-true}"
  VISION_ENABLE_GEMINI: "${VISION_ENABLE_GEMINI:-true}"
  VISION_ENABLE_OPENAI: "${VISION_ENABLE_OPENAI:-true}"
  VISION_YOLO_MODEL: "/app/model_weights/${TOUR_AI_YOLO_MODEL_NAME:-yolo11m.pt}"
  VISION_FLORENCE_MODEL: "${VISION_FLORENCE_MODEL:-microsoft/Florence-2-base}"
  VISION_PADDLEOCR_LANG: "${VISION_PADDLEOCR_LANG:-en}"
  PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "${PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK:-True}"
  VISION_PRIMARY_SEMANTIC_PROVIDER: "${VISION_PRIMARY_SEMANTIC_PROVIDER:-openai}"
  VISION_FALLBACK_SEMANTIC_PROVIDER: "${VISION_FALLBACK_SEMANTIC_PROVIDER:-gemini}"
  VISION_MAX_PANORAMA_FRAMES: "${VISION_MAX_PANORAMA_FRAMES:-24}"
  VISION_SEMANTIC_MAX_FRAMES: "${VISION_SEMANTIC_MAX_FRAMES:-12}"
  VISION_SEMANTIC_MAX_CLOUD_CALLS_PER_SCENE: "${VISION_SEMANTIC_MAX_CLOUD_CALLS_PER_SCENE:-4}"
  VISION_SEMANTIC_REQUEST_INTERVAL_SECONDS: "${VISION_SEMANTIC_REQUEST_INTERVAL_SECONDS:-1.25}"
  AI_VISION_PROVIDER_MAX_RETRIES: "${AI_VISION_PROVIDER_MAX_RETRIES:-1}"
  AI_VISION_PROVIDER_FAILURE_COOLDOWN_SECONDS: "${AI_VISION_PROVIDER_FAILURE_COOLDOWN_SECONDS:-180}"
  VISION_PUBLIC_ON_DEMAND_SCAN: "${VISION_PUBLIC_ON_DEMAND_SCAN:-true}"
  VISION_ON_DEMAND_ANALYSIS_MODE: "${VISION_ON_DEMAND_ANALYSIS_MODE:-celery}"
  VISION_ON_DEMAND_RETRY_AFTER_MS: "${VISION_ON_DEMAND_RETRY_AFTER_MS:-3000}"
  VISION_ANALYSIS_STALE_MINUTES: "${VISION_ANALYSIS_STALE_MINUTES:-45}"
  VISION_LONG_PRESS_DURATION_MS: "${VISION_LONG_PRESS_DURATION_MS:-650}"
  VISION_POINT_ON_DEMAND_INSPECTION: "${VISION_POINT_ON_DEMAND_INSPECTION:-true}"
  VISION_POINT_INSPECTION_FOV_DEGREES: "${VISION_POINT_INSPECTION_FOV_DEGREES:-46}"
  VISION_POINT_DETAIL_FOV_DEGREES: "${VISION_POINT_DETAIL_FOV_DEGREES:-26}"
  VISION_POINT_INSPECTION_FRAME_SIZE: "${VISION_POINT_INSPECTION_FRAME_SIZE:-768}"
  VISION_POINT_SEMANTIC_MIN_CONFIDENCE: "${VISION_POINT_SEMANTIC_MIN_CONFIDENCE:-0.55}"
  VISION_POINT_EXACT_CAPTURE_SEMANTIC_MIN_CONFIDENCE: "${VISION_POINT_EXACT_CAPTURE_SEMANTIC_MIN_CONFIDENCE:-0.58}"
  VISION_POINT_EXACT_CAPTURE_ONLY_MIN_CONFIDENCE: "${VISION_POINT_EXACT_CAPTURE_ONLY_MIN_CONFIDENCE:-0.64}"
  VISION_POINT_CAPTURE_MAX_BYTES: "${VISION_POINT_CAPTURE_MAX_BYTES:-2000000}"
  VISION_POINT_CAPTURE_MAX_DIMENSION: "${VISION_POINT_CAPTURE_MAX_DIMENSION:-1024}"
  VISION_POINT_CAPTURE_MAX_DATA_URL_LENGTH: "${VISION_POINT_CAPTURE_MAX_DATA_URL_LENGTH:-3000000}"
  VISION_SELECTION_REQUIRED: "${VISION_SELECTION_REQUIRED:-true}"
  VISION_SELECTION_MIN_SIZE_RATIO: "${VISION_SELECTION_MIN_SIZE_RATIO:-0.08}"
  VISION_SELECTION_MAX_SIZE_RATIO: "${VISION_SELECTION_MAX_SIZE_RATIO:-0.72}"
  VISION_MARZIPANO_PITCH_SIGN: "${VISION_MARZIPANO_PITCH_SIGN:--1}"

  # AI Tour Architect — staged objects, quality and Gemini navigation proposals
  TOUR_ARCHITECT_ENABLED: "${TOUR_ARCHITECT_ENABLED:-true}"
  TOUR_ARCHITECT_AUTO_RUN: "${TOUR_ARCHITECT_AUTO_RUN:-true}"
  TOUR_ARCHITECT_REQUIRE_ALL_SCENES_ANALYZED: "${TOUR_ARCHITECT_REQUIRE_ALL_SCENES_ANALYZED:-true}"
  TOUR_ARCHITECT_GEMINI_MODEL: "${TOUR_ARCHITECT_GEMINI_MODEL:-gemini-2.5-flash}"
  TOUR_ARCHITECT_LOCAL_THREAD_WORKERS: "${TOUR_ARCHITECT_LOCAL_THREAD_WORKERS:-1}"
  TOUR_ARCHITECT_STALE_MINUTES: "${TOUR_ARCHITECT_STALE_MINUTES:-45}"
  TOUR_ARCHITECT_TIMEOUT_SECONDS: "${TOUR_ARCHITECT_TIMEOUT_SECONDS:-150}"
  TOUR_ARCHITECT_MAX_OUTPUT_TOKENS: "${TOUR_ARCHITECT_MAX_OUTPUT_TOKENS:-5000}"
  TOUR_ARCHITECT_MAX_ANCHORS_PER_SCENE: "${TOUR_ARCHITECT_MAX_ANCHORS_PER_SCENE:-6}"
  TOUR_ARCHITECT_MAX_OUTGOING_LINKS: "${TOUR_ARCHITECT_MAX_OUTGOING_LINKS:-4}"
  TOUR_ARCHITECT_INCLUDE_ANCHOR_CROPS: "${TOUR_ARCHITECT_INCLUDE_ANCHOR_CROPS:-true}"
  TOUR_ARCHITECT_AUTO_APPLY_SAFE_LINKS: "${TOUR_ARCHITECT_AUTO_APPLY_SAFE_LINKS:-false}"
  TOUR_ARCHITECT_AUTO_APPLY_MIN_CONFIDENCE: "${TOUR_ARCHITECT_AUTO_APPLY_MIN_CONFIDENCE:-0.94}"
  TOUR_OBJECT_CATALOG_MIN_CONFIDENCE: "${TOUR_OBJECT_CATALOG_MIN_CONFIDENCE:-0.25}"
  TOUR_OBJECT_CATALOG_MAX_CANDIDATES: "${TOUR_OBJECT_CATALOG_MAX_CANDIDATES:-90}"
  TOUR_OBJECT_CLIENT_READY_MIN_CONFIDENCE: "${TOUR_OBJECT_CLIENT_READY_MIN_CONFIDENCE:-0.58}"
  TOUR_OBJECT_CLIENT_READY_MIN_CLARITY: "${TOUR_OBJECT_CLIENT_READY_MIN_CLARITY:-0.46}"

  # Mobile PDF streaming / discovery / domain agents
  PDF_MOBILE_INLINE_MAX_BYTES: "${PDF_MOBILE_INLINE_MAX_BYTES:-18874368}"
  PDF_PUBLIC_CACHE_SECONDS: "${PDF_PUBLIC_CACHE_SECONDS:-900}"
  PDF_STREAM_CHUNK_SIZE: "${PDF_STREAM_CHUNK_SIZE:-65536}"
  DISCOVERY_DEFAULT_RADIUS_KM: "${DISCOVERY_DEFAULT_RADIUS_KM:-40}"
  DISCOVERY_ENABLE_AI_QUERY_PARSER: "${DISCOVERY_ENABLE_AI_QUERY_PARSER:-true}"
  DISCOVERY_AI_QUERY_MODEL: "${DISCOVERY_AI_QUERY_MODEL:-gpt-5.6}"
  DISCOVERY_INTENT_CACHE_SECONDS: "${DISCOVERY_INTENT_CACHE_SECONDS:-600}"
  PUBLIC_DISCOVERY_RATE_LIMIT: "${PUBLIC_DISCOVERY_RATE_LIMIT:-30}"
  PUBLIC_DISCOVERY_RATE_WINDOW_SECONDS: "${PUBLIC_DISCOVERY_RATE_WINDOW_SECONDS:-300}"
  DOMAIN_INTELLIGENCE_AUTO_SYNC: "${DOMAIN_INTELLIGENCE_AUTO_SYNC:-true}"
  PUBLIC_APPOINTMENT_RATE_LIMIT: "${PUBLIC_APPOINTMENT_RATE_LIMIT:-5}"
  PUBLIC_APPOINTMENT_RATE_WINDOW_SECONDS: "${PUBLIC_APPOINTMENT_RATE_WINDOW_SECONDS:-900}"

  # Integrations
  GOOGLE_CALENDAR_ENABLED: "${GOOGLE_CALENDAR_ENABLED:-false}"
  GOOGLE_CALENDAR_DEFAULT_TIMEZONE: "${GOOGLE_CALENDAR_DEFAULT_TIMEZONE:-Africa/Johannesburg}"
  INTEGRATION_ENCRYPTION_KEY: "${INTEGRATION_ENCRYPTION_KEY:-}"

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      INSTALL_FULL_AI: "false"
  init: true
  restart: unless-stopped
  env_file:
    - .env
  environment:
    <<: *app-environment
  networks:
    - my_network
  secrets:
    - db_password
    - google_adc_json
  depends_on:
    db:
      condition: service_healthy
    db_vector_init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  django:
    <<: *app-common
    container_name: visite360_app
    command:
      - /bin/sh
      - -ec
      - |
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - static-data:/app/staticfiles
      - media-data:/app/media
      - ai-models:/app/model_weights
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; s=socket.create_connection(('127.0.0.1',8000),5); s.close()" || exit 1
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 180s

  celery_worker:
    <<: *app-common
    container_name: visite360_celery_worker
    command:
      - /bin/sh
      - -ec
      - |
        exec celery -A config worker \
          --loglevel=info \
          --concurrency=${CELERY_WORKER_CONCURRENCY:-2} \
          --queues=celery \
          --hostname=twinscopes-worker@%h
    volumes:
      - media-data:/app/media
      - ai-models:/app/model_weights
    depends_on:
      django:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai_worker:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_FULL_AI: "${INSTALL_FULL_AI:-true}"
        PADDLEPADDLE_VERSION: "${PADDLEPADDLE_VERSION:-3.3.0}"
    container_name: visite360_ai_worker
    environment:
      <<: *app-environment
      OMP_NUM_THREADS: "${AI_OMP_NUM_THREADS:-2}"
      MKL_NUM_THREADS: "${AI_MKL_NUM_THREADS:-2}"
      OPENBLAS_NUM_THREADS: "${AI_OPENBLAS_NUM_THREADS:-2}"
    command:
      - /bin/sh
      - -ec
      - |
        exec celery -A config worker \
          --loglevel=info \
          --concurrency=${AI_WORKER_CONCURRENCY:-1} \
          --queues=ai \
          --hostname=twinscopes-ai@%h
    volumes:
      - media-data:/app/media
      - ai-models:/app/model_weights
      - huggingface-cache:/root/.cache/huggingface
      - paddle-cache:/root/.paddleocr
    depends_on:
      django:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    <<: *app-common
    container_name: visite360_celery_beat
    command:
      - /bin/sh
      - -ec
      - |
        exec celery -A config beat \
          --loglevel=info \
          --schedule=/var/run/celery/celerybeat-schedule
    volumes:
      - media-data:/app/media
      - ai-models:/app/model_weights
      - celery-beat-data:/var/run/celery
    depends_on:
      django:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Manual tool: docker compose --profile tools run --rm ai_model_init
  ai_model_init:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_FULL_AI: "false"
    profiles: ["tools"]
    container_name: visite360_ai_model_init
    restart: "no"
    init: true
    env_file:
      - .env
    environment:
      <<: *app-environment
    command:
      - /bin/sh
      - -ec
      - |
        MODEL="/app/model_weights/${TOUR_AI_YOLO_MODEL_NAME:-yolo11m.pt}"
        if [ -s "$$MODEL" ]; then
          echo "YOLO model already present: $$MODEL"
          ls -lh "$$MODEL"
        else
          python manage.py download_tour_ai_models \
            --model "${TOUR_AI_YOLO_MODEL_NAME:-yolo11m.pt}"
        fi
    volumes:
      - ai-models:/app/model_weights
    networks:
      - my_network
    secrets:
      - db_password
      - google_adc_json

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.nginx
    container_name: visite360_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - static-data:/app/staticfiles:ro
      - media-data:/app/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/var:/var/lib/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      django:
        condition: service_healthy
      pgadmin:
        condition: service_started
    networks:
      - my_network

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    container_name: visite360_certbot
    restart: "no"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/var:/var/lib/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./nginx/openssl.cnf:/etc/ssl/openssl.cnf:ro
    command:
      - certonly
      - --webroot
      - --webroot-path=/var/www/certbot
      - --domain=twinscopes.com
      - --domain=www.twinscopes.com
      - --domain=pgadmin.twinscopes.com
      - --domain=api.twinscopes.com
      - --email=${CERTBOT_EMAIL:-pepexykabasele@gmail.com}
      - --agree-tos
      - --non-interactive
      - --keep-until-expiring
    networks:
      - my_network

  certbot-renew:
    image: certbot/certbot:latest
    container_name: visite360_certbot_renew
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/var:/var/lib/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -ec
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot || true
          sleep 12h & wait $$!
        done
    depends_on:
      nginx:
        condition: service_started
    networks:
      - my_network

  redis:
    image: redis:7-alpine
    container_name: visite360_redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - my_network

  db:
    image: pgvector/pgvector:pg16
    container_name: visite360_postgres_db
    restart: unless-stopped
    volumes:
      # Keep this volume key unchanged to preserve the existing production DB.
      - dev-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-enable-pgvector.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql:ro
    environment:
      POSTGRES_DB: elevateaidb
      POSTGRES_USER: elevateaiuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U elevateaiuser -d elevateaidb -h 127.0.0.1 -p 5432
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - my_network
    secrets:
      - db_password

  db_vector_init:
    image: pgvector/pgvector:pg16
    container_name: visite360_pgvector_init
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      export PGPASSWORD="$$(cat /run/secrets/db_password)"
      until pg_isready -h db -p 5432 -U elevateaiuser -d elevateaidb; do
        sleep 2
      done
      psql -v ON_ERROR_STOP=1 \
        -h db -p 5432 -U elevateaiuser -d elevateaidb \
        -c "CREATE EXTENSION IF NOT EXISTS vector;"
      psql -v ON_ERROR_STOP=1 \
        -h db -p 5432 -U elevateaiuser -d elevateaidb \
        -c "SELECT extname, extversion FROM pg_extension WHERE extname = 'vector';"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network
    secrets:
      - db_password

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_server
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:-pepexykabasele@gmail.com}"
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
      PGADMIN_LISTEN_PORT: "80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my_network
    secrets:
      - pgadmin_password

volumes:
  # Do not rename or remove these production volumes.
  dev-db-data:
  static-data:
  media-data:
  redis-data:
  pgadmin-data:
  celery-beat-data:
  ai-models:
  huggingface-cache:
  paddle-cache:

networks:
  my_network:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password.txt
  google_adc_json:
    file: ./secrets/google_adc.json
  pgadmin_password:
    file: ./secrets/pgadmin_password.txt
