upstream twinscopes_django { server django:8000; keepalive 32; }
upstream twinscopes_pgadmin { server pgadmin:80; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name twinscopes.com www.twinscopes.com api.twinscopes.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /static/ { alias /app/staticfiles/; expires 30d; add_header Cache-Control "public, immutable"; }
    location /media/ { alias /app/media/; expires 7d; add_header X-Frame-Options SAMEORIGIN always; }

    location /ws/ {
        proxy_pass http://twinscopes_django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600;
    }

    location / {
        proxy_pass http://twinscopes_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300;
    }
}

server {
    listen 80;
    server_name pgadmin.twinscopes.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        proxy_pass http://twinscopes_pgadmin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
