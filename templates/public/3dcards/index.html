<!doctype html>
{% load static %}
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>3D Cards — Taiwand</title>
   <link rel="stylesheet" href="{% static 'public/css/styles.css' %}">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0891b2">
<link rel="shortcut icon" type="image/png" href="{% static 'public/branding/favicon-32.png' %}">
<link rel="apple-touch-icon" href="{% static 'public/branding/apple-touch-icon.png' %}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Twinscopes">
<meta property="og:title" content="Twinscopes — Explore, Discover & Grow">
<meta property="og:description" content="Immersive 360° tours, Google Street View, products, bookings and intelligent business growth.">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
<meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'public/branding/twinscopes-social-card.jpg' %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Twinscopes">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Twinscopes — Explore, Discover & Grow">
<meta name="twitter:description" content="Immersive 360° tours, products and intelligent marketplace services.">
<meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'public/branding/twinscopes-social-card.jpg' %}">
</head>
<body>
  <main class="wrap">
    <section class="grid" id="cardGrid">
      <!-- Cards will be injected by script.js -->
    </section>
  </main>

      <script src="{% static 'public/js/script.js' %}"></script>

  <script type="module" src="script.js"></script>
<script defer src="{% static 'public/js/pwa-register-v7.js' %}"></script>
</body>
</html>
